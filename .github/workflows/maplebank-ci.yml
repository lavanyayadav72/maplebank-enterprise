name: MapleBank CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: app
        run: |
          python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build --pull --no-cache -t maplebank-api:${{ github.sha }} ./app
      
      - name: Verify Python packages in image
        run: |
          docker run --rm maplebank-api:${{ github.sha }} \
            python -m pip show msgpack setuptools || true
      
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: maplebank-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH