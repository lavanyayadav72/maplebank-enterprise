name: MapleBank CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: app
        run: |
          python -m py_compile app.py

      - name: Build immutable image
        run: |
          docker build \
            --pull \
            -t maplebankacrdev099.azurecr.io/maplebank-api:${{ github.sha }} \
            ./app

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maplebankacrdev099.azurecr.io/maplebank-api:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln
          vuln-type: os,library

      - name: Authenticate to Azure
        if: ${{ github.event_name == 'push' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push immutable image to ACR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          az acr login --name maplebankacrdev099

          docker push \
            maplebankacrdev099.azurecr.io/maplebank-api:${{ github.sha }}